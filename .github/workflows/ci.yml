name: EduSphere CI/CD Enterprise Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    name: Lint & Test Microservices
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18
        cache: 'npm'

    - name: Install Root Dependencies
      run: npm install

    - name: Run Frontend Lint & Build Test
      run: |
        cd frontend
        npm install
        npm run build

    - name: Run Backend Auth Service Test
      run: |
        cd backend/services/auth-service
        npm install
        npm run start &
        sleep 5
        curl -f http://localhost:3001/health || exit 1

  build-and-push:
    name: Dockerize & Publish Images
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Frontend Image
      uses: docker/build-push-action@v4
      with:
        context: ./frontend
        push: true
        tags: edusphere/frontend:latest

    - name: Build and Push Auth Service Image
      uses: docker/build-push-action@v4
      with:
        context: ./backend/services/auth-service
        push: true
        tags: edusphere/auth-service:latest

    - name: Build and Push User Service Image
      uses: docker/build-push-action@v4
      with:
        context: ./backend/services/user-service
        push: true
        tags: edusphere/user-service:latest

    - name: Build and Push Course Service Image
      uses: docker/build-push-action@v4
      with:
        context: ./backend/services/course-service
        push: true
        tags: edusphere/course-service:latest

    - name: Build and Push Attendance Service Image
      uses: docker/build-push-action@v4
      with:
        context: ./backend/services/attendance-service
        push: true
        tags: edusphere/attendance-service:latest
