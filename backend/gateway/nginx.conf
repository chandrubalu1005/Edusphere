worker_processes auto;
events { worker_connections 4096; }

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  client_max_body_size 100M;

  # ── Rate Limiting ──────────────────────────────────────────────────────
  limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

  # ── Upstream Services ──────────────────────────────────────────────────
  # Container names from docker-compose.yml (NOT localhost — services
  # communicate by container name on the edusphere_net bridge network)
  upstream auth_service         { server es_auth:3001; }
  upstream user_service         { server es_users:3002; }
  upstream course_service       { server es_courses:3003; }
  upstream notification_service { server es_notifications:3004; }
  upstream assessment_service   { server es_assessments:3005; }
  upstream assignment_service   { server es_assignments:3006; }
  upstream certificate_service  { server es_certificates:3007; }
  upstream attendance_service   { server es_attendance:3008; }
  upstream timetable_service    { server es_timetable:3009; }
  upstream calendar_service     { server es_calendar:3010; }
  upstream library_service      { server es_library:3011; }
  upstream placement_service    { server es_placement:3012; }
  upstream discussion_service   { server es_discussion:3013; }
  upstream analytics_service    { server es_analytics:3014; }
  upstream admin_service        { server es_admin:3015; }
  upstream frontend             { server es_frontend:80; }

  server {
    listen 80;
    server_name localhost edusphere.local;

    # ── Security Headers ──────────────────────────────────────────────
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # ── API Routes ────────────────────────────────────────────────────

    # Auth Service — /api/auth/*
    # proxy_pass with trailing slash strips the /api/auth/ prefix
    location /api/auth/ {
      limit_req zone=auth burst=5;
      proxy_pass         http://auth_service/;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # User Service — /api/users/*
    location /api/users/ {
      limit_req zone=api burst=20;
      proxy_pass         http://user_service/;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
    }

    # Course Service — /api/courses/*
    location /api/courses/ {
      limit_req zone=api burst=30;
      proxy_pass         http://course_service/;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
    }

    # Notification Service — /api/notifications/*
    # FIX: was proxy_pass http://notification_service/notifications/
    # which would double-prefix to /notifications/notifications/.
    # The service serves routes at its root (/notifications/*) so proxy to root.
    location /api/notifications/ {
      limit_req zone=api burst=20;
      proxy_pass         http://notification_service/;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
    }

    # Socket.IO WebSocket upgrade for notifications
    location /socket.io/ {
      proxy_pass         http://notification_service;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host $host;
      proxy_read_timeout 86400;
    }

    # Assessment Service — /api/assessments/*
    location /api/assessments/ {
      limit_req zone=api burst=20;
      proxy_pass         http://assessment_service/;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_read_timeout 120;
    }

    # Assignment Service — /api/assignments/*
    # Service serves routes at /assignments/* so proxy to root to preserve path
    location /api/assignments/ {
      limit_req zone=api burst=20;
      proxy_pass         http://assignment_service/;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_read_timeout 120;
    }

    # Assignment file uploads
    location /uploads/assignments/ {
      proxy_pass         http://assignment_service/uploads/assignments/;
      proxy_set_header   Host $host;
    }

    # Certificate Service — /api/certificates/*
    # Service serves routes at /certificates/* so proxy to root
    location /api/certificates/ {
      limit_req zone=api burst=10;
      proxy_pass         http://certificate_service/;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
    }

    # Certificate verification (public, no auth needed)
    location /verify/ {
      proxy_pass         http://certificate_service/verify/;
      proxy_set_header   Host $host;
    }

    # Certificate downloads
    location /certs/ {
      proxy_pass         http://certificate_service/certs/;
      proxy_set_header   Host $host;
    }

    # Attendance Service — /api/attendance/*
    location /api/attendance/ {
      limit_req zone=api burst=20;
      proxy_pass         http://attendance_service/;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
    }

    # Timetable Service — /api/timetable/*
    location /api/timetable/ {
      limit_req zone=api burst=20;
      proxy_pass         http://timetable_service/;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
    }

    # Calendar Service — /api/calendar/*
    location /api/calendar/ {
      limit_req zone=api burst=20;
      proxy_pass         http://calendar_service/;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
    }

    # Library Service — /api/library/*
    location /api/library/ {
      limit_req zone=api burst=20;
      proxy_pass         http://library_service/;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
    }

    # Placement Service — /api/placement/*
    location /api/placement/ {
      limit_req zone=api burst=20;
      proxy_pass         http://placement_service/;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
    }

    # Discussion Service — /api/discussion/*
    location /api/discussion/ {
      limit_req zone=api burst=20;
      proxy_pass         http://discussion_service/;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
    }

    # Analytics Service — /api/analytics/*
    location /api/analytics/ {
      limit_req zone=api burst=20;
      proxy_pass         http://analytics_service/;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
    }

    # Admin Service — /api/admin/*
    location /api/admin/ {
      limit_req zone=api burst=20;
      proxy_pass         http://admin_service/;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
    }

    # Health check endpoint (aggregated)
    location /health {
      access_log off;
      return 200 '{"status":"ok","gateway":"nginx","timestamp":"$time_iso8601"}';
      add_header Content-Type application/json;
    }

    # ── Frontend (Production Build served by es_frontend container) ───
    location / {
      proxy_pass         http://frontend;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host $host;
      proxy_cache_bypass $http_upgrade;
    }
  }
}
