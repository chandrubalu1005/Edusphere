worker_processes auto;
events { worker_connections 4096; }

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  client_max_body_size 100M;

  # ── Rate Limiting ──────────────────────────────────────────────────────
  limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

  # ── Upstream Services ──────────────────────────────────────────────────
  # Container names from compose.lan.yml mapped to app_net
  upstream auth_service         { server lan_auth:3001; }
  upstream user_service         { server lan_users:3002; }
  upstream course_service       { server lan_courses:3003; }
  upstream notification_service { server lan_notifications:3004; }
  upstream attendance_service   { server lan_attendance:3008; }
  upstream library_service      { server lan_library:3011; }
  upstream finance_service      { server lan_finance:3016; }
  # Note: Other services can be added here if defined in compose.lan.yml
  upstream frontend             { server lan_frontend:80; }

  server {
    listen 80;
    server_name localhost edusphere.local;

    # ── Security Headers ──────────────────────────────────────────────
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # ── API Routes ────────────────────────────────────────────────────

    # Auth Service — /api/auth/*
    location /api/auth/ {
      limit_req zone=auth burst=5;
      proxy_pass         http://auth_service/;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # User Service — /api/users/
    location /api/users/ {
      limit_req zone=api burst=20;
      proxy_pass         http://user_service/;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
    }

    # Course Service — /api/courses/
    location /api/courses/ {
      limit_req zone=api burst=30;
      proxy_pass         http://course_service/;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
    }

    # Notification Service — /api/notifications
    location /api/notifications {
      limit_req zone=api burst=20;
      proxy_pass         http://notification_service/notifications;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
    }

    # Socket.IO WebSocket upgrade for notifications (and potentially attendance)
    location /socket.io/ {
      proxy_pass         http://notification_service;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host $host;
      proxy_read_timeout 86400;
    }

    # Attendance Service — /api/attendance/
    location /api/attendance/ {
      limit_req zone=api burst=20;
      proxy_pass         http://attendance_service/;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
    }

    # Leave Management (handled by Attendance Service)
    location /api/leave/ {
      limit_req zone=api burst=20;
      proxy_pass         http://attendance_service/leave/;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
    }

    # Library Service — /api/library/
    location /api/library/ {
      limit_req zone=api burst=20;
      proxy_pass         http://library_service/;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
    }

    # Finance Service — /api/finance/
    location /api/finance/ {
      limit_req zone=api burst=20;
      proxy_pass         http://finance_service/;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
    }

    # Health check endpoint (aggregated)
    location /health {
      access_log off;
      return 200 '{"status":"ok","gateway":"nginx","timestamp":"$time_iso8601"}';
      add_header Content-Type application/json;
    }

    # ── Frontend (Production Build served by lan_frontend container) ───
    location / {
      proxy_pass         http://frontend;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host $host;
      proxy_cache_bypass $http_upgrade;
    }
  }
}
