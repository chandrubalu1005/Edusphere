version: '3.9'

networks:
  edge_net:
    driver: bridge
  app_net:
    driver: bridge
  data_net:
    driver: bridge
  observability_net:
    driver: bridge

volumes:
  lan_mongo_data:
  lan_redis_data:
  lan_rabbitmq_data:
  lan_meili_data:
  lan_minio_data:

services:
  # ── Infrastructure (DATA NET) ──────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: lan_mongodb
    restart: unless-stopped
    command: ["mongod", "--auth"]
    # NO HOST PORTS EXPOSED
    volumes: 
      - lan_mongo_data:/data/db
      - ./mongo/init.js:/docker-entrypoint-initdb.d/init.js:ro
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      # Pass through for the init script
      MONGO_AUTH_PASS: ${MONGO_AUTH_PASS}
      MONGO_USER_PASS: ${MONGO_USER_PASS}
      MONGO_COURSE_PASS: ${MONGO_COURSE_PASS}
      MONGO_NOTIF_PASS: ${MONGO_NOTIF_PASS}
      MONGO_ATTENDANCE_PASS: ${MONGO_ATTENDANCE_PASS}
      MONGO_LIBRARY_PASS: ${MONGO_LIBRARY_PASS}
      MONGO_CALENDAR_PASS: ${MONGO_CALENDAR_PASS}
      MONGO_TIMETABLE_PASS: ${MONGO_TIMETABLE_PASS}
      MONGO_FINANCE_PASS: ${MONGO_FINANCE_PASS}
      MONGO_ASSIGNMENT_PASS: ${MONGO_ASSIGNMENT_PASS}
      MONGO_ASSESSMENT_PASS: ${MONGO_ASSESSMENT_PASS}
      MONGO_CERTIFICATE_PASS: ${MONGO_CERTIFICATE_PASS}
      MONGO_PLACEMENT_PASS: ${MONGO_PLACEMENT_PASS}
      MONGO_DISCUSSION_PASS: ${MONGO_DISCUSSION_PASS}
      MONGO_ANALYTICS_PASS: ${MONGO_ANALYTICS_PASS}
      MONGO_ADMIN_PASS: ${MONGO_ADMIN_PASS}
    networks: [data_net]
    healthcheck:
      test: ["CMD","mongosh","-u","${MONGO_INITDB_ROOT_USERNAME}","-p","${MONGO_INITDB_ROOT_PASSWORD}","--authenticationDatabase","admin","--eval","db.adminCommand('ping')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7.2-alpine
    container_name: lan_redis
    restart: unless-stopped
    # NO HOST PORTS EXPOSED
    volumes: [lan_redis_data:/data]
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks: [data_net]
    healthcheck:
      test: ["CMD","redis-cli","-a","${REDIS_PASSWORD}","ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: lan_rabbitmq
    restart: unless-stopped
    # NO HOST PORTS EXPOSED
    volumes: [lan_rabbitmq_data:/var/lib/rabbitmq]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    networks: [data_net]
    healthcheck:
      test: ["CMD","rabbitmq-diagnostics","-q","ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  meilisearch:
    image: getmeili/meilisearch:v1.4
    container_name: lan_meilisearch
    restart: unless-stopped
    # NO HOST PORTS EXPOSED
    volumes: [lan_meili_data:/meili_data]
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: production
    networks: [data_net]
    healthcheck:
      test: ["CMD","wget","--no-verbose","--tries=1","--spider","http://localhost:7700/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  minio:
    image: minio/minio:latest
    container_name: lan_minio
    restart: unless-stopped
    # NO HOST PORTS EXPOSED
    volumes: [lan_minio_data:/data]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    networks: [data_net]
    healthcheck:
      test: ["CMD","mc","ready","local"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s

  # ── Microservices (APP NET & DATA NET) ────────────────────────────────────────────────
  auth-service:
    build:
      context: ../backend/services/auth-service
      dockerfile: Dockerfile
    container_name: lan_auth
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://auth_user:${MONGO_AUTH_PASS}@lan_mongodb:27017/edusphere_auth
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      REDIS_URL: redis://:${REDIS_PASSWORD}@lan_redis:6379
      PORT: 3001
    depends_on:
      mongodb: { condition: service_healthy }
      redis:   { condition: service_healthy }
    networks: [app_net, data_net]
    healthcheck:
      test: ["CMD","wget","--no-verbose","--tries=1","--spider","http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  user-service:
    build:
      context: ../backend/services/user-service
      dockerfile: Dockerfile
    container_name: lan_users
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://users_user:${MONGO_USER_PASS}@lan_mongodb:27017/edusphere_users
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@lan_rabbitmq:5672
      MEILISEARCH_HOST: http://lan_meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      PORT: 3002
    depends_on:
      mongodb:  { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [app_net, data_net]

  course-service:
    build:
      context: ../backend/services/course-service
      dockerfile: Dockerfile
    container_name: lan_courses
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://course_user:${MONGO_COURSE_PASS}@lan_mongodb:27017/edusphere_courses
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@lan_rabbitmq:5672
      MEILISEARCH_HOST: http://lan_meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      PORT: 3003
    depends_on:
      mongodb:  { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [app_net, data_net]

  notification-service:
    build:
      context: ../backend/services/notification-service
      dockerfile: Dockerfile
    container_name: lan_notifications
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://notif_user:${MONGO_NOTIF_PASS}@lan_mongodb:27017/edusphere_notifications
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@lan_rabbitmq:5672
      PORT: 3004
    depends_on:
      mongodb:  { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [app_net, data_net]

  attendance-service:
    build:
      context: ../backend/services/attendance-service
      dockerfile: Dockerfile
    container_name: lan_attendance
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://attendance_user:${MONGO_ATTENDANCE_PASS}@lan_mongodb:27017/edusphere_attendance
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@lan_rabbitmq:5672
      REDIS_URL: redis://:${REDIS_PASSWORD}@lan_redis:6379
      PORT: 3008
    depends_on:
      mongodb: { condition: service_healthy }
    networks: [app_net, data_net]

  library-service:
    build:
      context: ../backend/services/library-service
      dockerfile: Dockerfile
    container_name: lan_library
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://library_user:${MONGO_LIBRARY_PASS}@lan_mongodb:27017/edusphere_library
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3011
    depends_on:
      mongodb: { condition: service_healthy }
    networks: [app_net, data_net]
    
  finance-service:
    build:
      context: ../backend/services/finance-service
      dockerfile: Dockerfile
    container_name: lan_finance
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://finance_user:${MONGO_FINANCE_PASS}@lan_mongodb:27017/edusphere_finance
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3016
    depends_on:
      mongodb: { condition: service_healthy }
    networks: [app_net, data_net]

  # ── Frontend ───────────────────────────────────────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: lan_frontend
    restart: unless-stopped
    networks: [app_net]

  # ── Observability ──────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: lan_prometheus
    restart: unless-stopped
    # NO HOST PORTS EXPOSED
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [observability_net, app_net, data_net]

  grafana:
    image: grafana/grafana:10.0.0
    container_name: lan_grafana
    restart: unless-stopped
    # NO HOST PORTS EXPOSED
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
    networks: [observability_net]

  # ── API Gateway (EDGE NET) ─────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: lan_gateway
    restart: unless-stopped
    ports: 
      - "80:80"
      # - "443:443" # Uncomment when SSL certs are placed
    volumes:
      - ../backend/gateway/nginx.lan.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - auth-service
      - user-service
      - course-service
      - notification-service
      - attendance-service
      - library-service
      - finance-service
    networks: [edge_net, app_net]
