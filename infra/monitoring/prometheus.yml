global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'auth-service'
    static_configs:
      - targets: ['auth-service:3001']

  - job_name: 'user-service'
    static_configs:
      - targets: ['user-service:3002']

  - job_name: 'course-service'
    static_configs:
      - targets: ['course-service:3003']

  - job_name: 'notification-service'
    static_configs:
      - targets: ['notification-service:3004']

  - job_name: 'assessment-service'
    static_configs:
      - targets: ['assessment-service:3005']

  - job_name: 'assignment-service'
    static_configs:
      - targets: ['assignment-service:3006']

  - job_name: 'certificate-service'
    static_configs:
      - targets: ['certificate-service:3007']

  - job_name: 'attendance-service'
    static_configs:
      - targets: ['attendance-service:3008']

  - job_name: 'timetable-service'
    static_configs:
      - targets: ['timetable-service:3009']

  - job_name: 'calendar-service'
    static_configs:
      - targets: ['calendar-service:3010']

  - job_name: 'library-service'
    static_configs:
      - targets: ['library-service:3011']

  - job_name: 'placement-service'
    static_configs:
      - targets: ['placement-service:3012']

  - job_name: 'discussion-service'
    static_configs:
      - targets: ['discussion-service:3013']

  - job_name: 'analytics-service'
    static_configs:
      - targets: ['analytics-service:3014']

  - job_name: 'admin-service'
    static_configs:
      - targets: ['admin-service:3015']
