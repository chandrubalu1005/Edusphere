apiVersion: v1
kind: Namespace
metadata:
  name: edusphere-prod

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: edusphere-config
  namespace: edusphere-prod
data:
  JWT_SECRET: "supersecretjwtkey123"
  RABBITMQ_URL: "amqp://rabbitmq.edusphere-prod.svc.cluster.local:5672"
  MONGO_URI_AUTH: "mongodb://mongodb.edusphere-prod.svc.cluster.local:27017/edusphere_auth"
  MONGO_URI_USERS: "mongodb://mongodb.edusphere-prod.svc.cluster.local:27017/edusphere_users"
  MONGO_URI_COURSES: "mongodb://mongodb.edusphere-prod.svc.cluster.local:27017/edusphere_courses"
  MONGO_URI_ATTENDANCE: "mongodb://mongodb.edusphere-prod.svc.cluster.local:27017/edusphere_attendance"
  MONGO_URI_TIMETABLE: "mongodb://mongodb.edusphere-prod.svc.cluster.local:27017/edusphere_timetable"
  MONGO_URI_CALENDAR: "mongodb://mongodb.edusphere-prod.svc.cluster.local:27017/edusphere_calendar"
  MONGO_URI_LIBRARY: "mongodb://mongodb.edusphere-prod.svc.cluster.local:27017/edusphere_library"
  MONGO_URI_PLACEMENT: "mongodb://mongodb.edusphere-prod.svc.cluster.local:27017/edusphere_placement"
  MONGO_URI_DISCUSSIONS: "mongodb://mongodb.edusphere-prod.svc.cluster.local:27017/edusphere_discussions"
  MONGO_URI_ANALYTICS: "mongodb://mongodb.edusphere-prod.svc.cluster.local:27017/edusphere_analytics"
  MONGO_URI_ADMIN: "mongodb://mongodb.edusphere-prod.svc.cluster.local:27017/edusphere_admin"
  REDIS_URL: "redis://redis.edusphere-prod.svc.cluster.local:6379"

---

# Auth Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: edusphere-prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: edusphere/auth-service:latest
        ports:
        - containerPort: 3001
        envFrom:
        - configMapRef:
            name: edusphere-config
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 15
          periodSeconds: 15

---

apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: edusphere-prod
spec:
  ports:
  - port: 3001
    targetPort: 3001
  selector:
    app: auth-service

---

