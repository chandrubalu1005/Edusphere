apiVersion: v1
kind: Namespace
metadata:
  name: edusphere-prod

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: edusphere-config
  namespace: edusphere-prod
data:
  JWT_SECRET: "edusphere_super_secret_jwt_key_change_in_production_2026"
  RABBITMQ_URL: "amqp://edusphere:edusphere_pass@rabbitmq.edusphere-prod.svc.cluster.local:5672"
  REDIS_URL: "redis://redis.edusphere-prod.svc.cluster.local:6379"

---

# ── Infrastructure Deployments & Services ──────────────────────────────────

# MongoDB
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: edusphere-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
      - name: mongodb
        image: mongo:7.0
        ports:
        - containerPort: 27017
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: edusphere-prod
spec:
  ports:
  - port: 27017
    targetPort: 27017
  selector:
    app: mongodb

---

# Redis
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: edusphere-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7.2-alpine
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: edusphere-prod
spec:
  ports:
  - port: 6379
    targetPort: 6379
  selector:
    app: redis

---

# RabbitMQ
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: edusphere-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:3.12-management-alpine
        ports:
        - containerPort: 5672
        - containerPort: 15672
        env:
        - name: RABBITMQ_DEFAULT_USER
          value: "edusphere"
        - name: RABBITMQ_DEFAULT_PASS
          value: "edusphere_pass"
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: edusphere-prod
spec:
  ports:
  - port: 5672
    name: amqp
    targetPort: 5672
  - port: 15672
    name: mgmt
    targetPort: 15672
  selector:
    app: rabbitmq

---

# ── Microservices Deployments & Services ─────────────────────────────────

# 1. Auth Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: edusphere-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: edusphere/auth-service:latest
        ports:
        - containerPort: 3001
        env:
        - name: MONGO_URI
          value: "mongodb://mongodb.edusphere-prod.svc.cluster.local:27017/edusphere_auth"
        - name: PORT
          value: "3001"
        envFrom:
        - configMapRef:
            name: edusphere-config
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 15
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: edusphere-prod
spec:
  ports:
  - port: 3001
    targetPort: 3001
  selector:
    app: auth-service

---

