version: '3.9'

networks:
  edusphere_net:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
  rabbitmq_data:
  meilisearch_data:
  minio_data:

services:
  # ── Infrastructure ──────────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: es_mongodb
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]
    environment:
      MONGO_INITDB_DATABASE: edusphere
    networks: [edusphere_net]
    healthcheck:
      test: ["CMD","mongosh","--eval","db.runCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: es_redis
    restart: unless-stopped
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks: [edusphere_net]
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: es_rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"   # Management UI
    volumes: [rabbitmq_data:/var/lib/rabbitmq]
    environment:
      RABBITMQ_DEFAULT_USER: edusphere
      RABBITMQ_DEFAULT_PASS: edusphere_pass
    networks: [edusphere_net]
    healthcheck:
      test: ["CMD","rabbitmq-diagnostics","-q","ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.4
    container_name: es_meilisearch
    restart: unless-stopped
    ports: ["7700:7700"]
    volumes: [meilisearch_data:/meili_data]
    environment:
      MEILI_MASTER_KEY: masterKey
      MEILI_ENV: development
    networks: [edusphere_net]

  minio:
    image: minio/minio:latest
    container_name: es_minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"   # MinIO Console
    volumes: [minio_data:/data]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    networks: [edusphere_net]
    healthcheck:
      test: ["CMD","mc","ready","local"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ── Microservices ───────────────────────────────────────────────────────
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: es_auth
    restart: unless-stopped
    ports: ["3001:3001"]
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://es_mongodb:27017/edusphere_auth
      JWT_SECRET: ${JWT_SECRET:-edusphere_secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-edusphere_refresh}
      REDIS_URL: redis://es_redis:6379
      PORT: 3001
    depends_on:
      mongodb: { condition: service_healthy }
      redis:   { condition: service_healthy }
    networks: [edusphere_net]

  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: es_users
    restart: unless-stopped
    ports: ["3002:3002"]
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://es_mongodb:27017/edusphere_users
      JWT_SECRET: ${JWT_SECRET:-edusphere_secret}
      RABBITMQ_URL: amqp://edusphere:edusphere_pass@es_rabbitmq:5672
      MEILISEARCH_HOST: http://es_meilisearch:7700
      PORT: 3002
    depends_on:
      mongodb:  { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [edusphere_net]

  course-service:
    build:
      context: ./services/course-service
      dockerfile: Dockerfile
    container_name: es_courses
    restart: unless-stopped
    ports: ["3003:3003"]
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://es_mongodb:27017/edusphere_courses
      JWT_SECRET: ${JWT_SECRET:-edusphere_secret}
      RABBITMQ_URL: amqp://edusphere:edusphere_pass@es_rabbitmq:5672
      MEILISEARCH_HOST: http://es_meilisearch:7700
      PORT: 3003
    depends_on:
      mongodb:  { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [edusphere_net]

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: es_notifications
    restart: unless-stopped
    ports: ["3004:3004"]
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://es_mongodb:27017/edusphere_notifications
      JWT_SECRET: ${JWT_SECRET:-edusphere_secret}
      RABBITMQ_URL: amqp://edusphere:edusphere_pass@es_rabbitmq:5672
      SMTP_HOST: ${SMTP_HOST:-smtp.mailtrap.io}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      PORT: 3004
    depends_on:
      mongodb:  { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [edusphere_net]

  assessment-service:
    build:
      context: ./services/assessment-service
      dockerfile: Dockerfile
    container_name: es_assessments
    restart: unless-stopped
    ports: ["3005:3005"]
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://es_mongodb:27017/edusphere_assessments
      JWT_SECRET: ${JWT_SECRET:-edusphere_secret}
      REDIS_URL: redis://es_redis:6379
      PORT: 3005
    depends_on:
      mongodb: { condition: service_healthy }
      redis:   { condition: service_healthy }
    networks: [edusphere_net]

  assignment-service:
    build:
      context: ./services/assignment-service
      dockerfile: Dockerfile
    container_name: es_assignments
    restart: unless-stopped
    ports: ["3006:3006"]
    volumes:
      - ./uploads/assignments:/app/uploads/assignments
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://es_mongodb:27017/edusphere_assignments
      JWT_SECRET: ${JWT_SECRET:-edusphere_secret}
      RABBITMQ_URL: amqp://edusphere:edusphere_pass@es_rabbitmq:5672
      UPLOAD_DIR: /app/uploads/assignments
      PORT: 3006
    depends_on:
      mongodb:  { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [edusphere_net]

  certificate-service:
    build:
      context: ./services/certificate-service
      dockerfile: Dockerfile
    container_name: es_certificates
    restart: unless-stopped
    ports: ["3007:3007"]
    volumes:
      - ./uploads/certificates:/app/uploads/certificates
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://es_mongodb:27017/edusphere_certificates
      JWT_SECRET: ${JWT_SECRET:-edusphere_secret}
      CERT_DIR: /app/uploads/certificates
      BASE_URL: http://localhost
      PORT: 3007
    depends_on:
      mongodb: { condition: service_healthy }
    networks: [edusphere_net]

  attendance-service:
    build:
      context: ./services/attendance-service
      dockerfile: Dockerfile
    container_name: es_attendance
    restart: unless-stopped
    ports: ["3008:3008"]
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://es_mongodb:27017/edusphere_attendance
      JWT_SECRET: ${JWT_SECRET:-edusphere_secret}
      REDIS_URL: redis://es_redis:6379
      PORT: 3008
    depends_on:
      mongodb: { condition: service_healthy }
      redis:   { condition: service_healthy }
    networks: [edusphere_net]

  timetable-service:
    build:
      context: ./services/timetable-service
      dockerfile: Dockerfile
    container_name: es_timetable
    restart: unless-stopped
    ports: ["3009:3009"]
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://es_mongodb:27017/edusphere_timetable
      JWT_SECRET: ${JWT_SECRET:-edusphere_secret}
    depends_on:
      mongodb: { condition: service_healthy }
    networks: [edusphere_net]

  calendar-service:
    build:
      context: ./services/calendar-service
      dockerfile: Dockerfile
    container_name: es_calendar
    restart: unless-stopped
    ports: ["3010:3010"]
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://es_mongodb:27017/edusphere_calendar
      JWT_SECRET: ${JWT_SECRET:-edusphere_secret}
    depends_on:
      mongodb: { condition: service_healthy }
    networks: [edusphere_net]

  library-service:
    build:
      context: ./services/library-service
      dockerfile: Dockerfile
    container_name: es_library
    restart: unless-stopped
    ports: ["3011:3011"]
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://es_mongodb:27017/edusphere_library
      JWT_SECRET: ${JWT_SECRET:-edusphere_secret}
    depends_on:
      mongodb: { condition: service_healthy }
    networks: [edusphere_net]

  placement-service:
    build:
      context: ./services/placement-service
      dockerfile: Dockerfile
    container_name: es_placement
    restart: unless-stopped
    ports: ["3012:3012"]
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://es_mongodb:27017/edusphere_placement
      JWT_SECRET: ${JWT_SECRET:-edusphere_secret}
    depends_on:
      mongodb: { condition: service_healthy }
    networks: [edusphere_net]

  discussion-service:
    build:
      context: ./services/discussion-service
      dockerfile: Dockerfile
    container_name: es_discussion
    restart: unless-stopped
    ports: ["3013:3013"]
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://es_mongodb:27017/edusphere_discussions
      JWT_SECRET: ${JWT_SECRET:-edusphere_secret}
    depends_on:
      mongodb: { condition: service_healthy }
    networks: [edusphere_net]

  analytics-service:
    build:
      context: ./services/analytics-service
      dockerfile: Dockerfile
    container_name: es_analytics
    restart: unless-stopped
    ports: ["3014:3014"]
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://es_mongodb:27017/edusphere_analytics
      JWT_SECRET: ${JWT_SECRET:-edusphere_secret}
    depends_on:
      mongodb: { condition: service_healthy }
    networks: [edusphere_net]

  admin-service:
    build:
      context: ./services/admin-service
      dockerfile: Dockerfile
    container_name: es_admin
    restart: unless-stopped
    ports: ["3015:3015"]
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://es_mongodb:27017/edusphere_admin
      JWT_SECRET: ${JWT_SECRET:-edusphere_secret}
    depends_on:
      mongodb: { condition: service_healthy }
    networks: [edusphere_net]

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: es_prometheus
    restart: unless-stopped
    ports: ["9090:9090"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [edusphere_net]

  grafana:
    image: grafana/grafana:10.0.0
    container_name: es_grafana
    restart: unless-stopped
    ports: ["3000:3000"]
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks: [edusphere_net]

  # ── API Gateway ────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: es_gateway
    restart: unless-stopped
    ports: ["80:80"]
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - user-service
      - course-service
      - notification-service
      - assessment-service
      - assignment-service
      - certificate-service
      - attendance-service
      - timetable-service
      - calendar-service
      - library-service
      - placement-service
      - discussion-service
      - analytics-service
      - admin-service
    networks: [edusphere_net]

